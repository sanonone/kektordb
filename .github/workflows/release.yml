name: Build & Release KektorDB

on:
  release:
    types: [published]

permissions:
  contents: write

env:
  IMAGE: none99/kektordb

jobs:
  create-release-assets:
    name: Create Release Assets
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.26"

      - name: Set up Rust (Stable Toolchain)
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: stable
      
      - name: Set up Zig
        uses: goto-bus-stop/setup-zig@v2
        with:
          version: 0.15.2

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y p7zip-full mingw-w64 g++-aarch64-linux-gnu

      - name: Add all Rust cross-compilation targets
        run: |
          rustup target add x86_64-unknown-linux-gnu
          rustup target add aarch64-unknown-linux-gnu
          rustup target add x86_64-pc-windows-gnu
          rustup target add aarch64-apple-darwin
          rustup target add x86_64-apple-darwin

      - name: Run unit tests (Go-pure mode)
        # Eseguiamo i test sulla versione più semplice e portabile
        run: make test

      - name: Build all release binaries using Makefile
        # Il Makefile si occuperà di tutta la logica di cross-compilazione
        run: make release
      
      - name: Package release assets into archives
        run: |
          cd release
          for f in *; do
            BASENAME=$(echo "$f" | sed 's/\.exe$//')
            if [[ "$f" == *.exe ]]; then
              zip "${BASENAME}.zip" "$f" ../LICENSE ../README.md
            else
              tar -czvf "${BASENAME}.tar.gz" "$f" ../LICENSE ../README.md
            fi
          done
          # Elenca i file creati per il debug
          ls -l ../
          mv *.zip *.tar.gz ../
          
      - name: Upload Release Assets
        uses: softprops/action-gh-release@v1
        with:
          # Carica tutti i file .zip e .tar.gz dalla radice
          files: |
            *.zip
            *.tar.gz

  # ─────────────────────────────────────────────────────────
  # Docker: one image, mixed manifest — Rust-enabled binary on
  # linux/amd64 + linux/arm64, pure-Go binary on linux/arm/v7
  # (Raspberry Pi; candle/tokenizers are not feasible on 32-bit).
  # Each build pushes a per-variant tag, then `imagetools create`
  # merges them into the final tags (no duplicate platforms).
  # ─────────────────────────────────────────────────────────
  docker-publish:
    name: Publish Docker Image
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Build pure-Go image (arm/v7)
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          platforms: linux/arm/v7
          push: true
          tags: ${{ env.IMAGE }}:tmp-go
          build-args: VERSION=${{ github.ref_name }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build Rust image (amd64 + arm64)
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile.rust
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ env.IMAGE }}:tmp-rust
          build-args: VERSION=${{ github.ref_name }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Merge manifests into release tags
        run: |
          docker buildx imagetools create \
            -t ${{ env.IMAGE }}:${{ github.ref_name }} \
            -t ${{ env.IMAGE }}:latest \
            ${{ env.IMAGE }}:tmp-rust \
            ${{ env.IMAGE }}:tmp-go

  # ─────────────────────────────────────────────────────────
  # npm: publish the TypeScript client with the tag version.
  # ─────────────────────────────────────────────────────────
  npm-publish:
    name: Publish npm package
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "18"
          registry-url: "https://registry.npmjs.org"

      - name: Build and publish to npm
        working-directory: clients/typescript
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          npm ci
          npm version --no-git-tag-version "${VERSION}"
          npm run build
          npm publish

  # ─────────────────────────────────────────────────────────
  # PyPI: publish the Python client with the tag version.
  # ─────────────────────────────────────────────────────────
  pypi-publish:
    name: Publish PyPI package
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Build and publish to PyPI
        working-directory: clients/python
        env:
          TWINE_USERNAME: __token__
          TWINE_PASSWORD: ${{ secrets.PYPI_TOKEN }}
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          pip install build twine
          sed -i "s/version=\"[^\"]*\"/version=\"${VERSION}\"/" setup.py
          python -m build
          twine upload --skip-existing dist/*
